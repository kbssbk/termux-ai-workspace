<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191c"><title>AI Workspace</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<main class="shell"><header><div><div class="eyebrow" data-i18n="eyebrow">LOCAL DEVELOPMENT</div><h1 data-i18n="title">AI Workspace</h1><p data-i18n="subtitle"></p></div><div class="top-actions"><select id="language" aria-label="Language"><option value="auto">Auto</option><option value="ko">한국어</option><option value="en">English</option></select><button id="refresh" class="quiet" data-i18n="refresh">Refresh</button></div></header>
<section class="hero"><div><span class="pulse"></span><span id="overall">Checking…</span></div><strong id="readyCount">—</strong></section>
<section><div class="section-head"><h2 data-i18n="projects">Projects</h2><button id="guideOpen" class="guide-open"><span>ⓘ</span><span data-i18n="workflowGuide">작업 단계 안내</span></button></div><div id="projects" class="projects"></div></section>
<section><h2 data-i18n="system">System</h2><div id="services" class="services"></div></section>
<section><h2 data-i18n="activity">Recent activity</h2><div id="activity" class="activity"></div></section></main>
<div class="action-progress" aria-live="polite"><span class="spinner"></span><span id="progressText" data-i18n="running">Running…</span></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="workflowGuide" class="guide-dialog"><div class="sheet-head"><div><span class="eyebrow" data-i18n="workflowEyebrow">WORKFLOW</span><strong data-i18n="workflowTitle">4단계 개발 흐름</strong></div><button id="guideClose" class="quiet" data-i18n="close">닫기</button></div><p class="guide-intro" data-i18n="workflowIntro"></p><div class="guide-steps"><div class="guide-step"><b>01</b><div><strong>Pull</strong><p data-i18n="pullExplain"></p></div></div><div class="guide-step"><b>02</b><div><strong>Build</strong><p data-i18n="buildExplain"></p></div></div><div class="guide-step"><b>03</b><div><strong>Test</strong><p data-i18n="testExplain"></p></div></div><div class="guide-step"><b>04</b><div><strong>Deploy</strong><p data-i18n="deployExplain"></p></div></div></div></dialog>
<dialog id="details"><div class="sheet-head"><div><span class="eyebrow" data-i18n="details">DETAILS</span><strong id="detailsTitle">Result</strong></div><button id="close" class="quiet" data-i18n="close">Close</button></div><div id="detailsSummary" class="details-summary"></div><pre id="detailsBody"></pre></dialog>
<script src="/static/i18n.js"></script><script src="/static/app.js"></script></body></html>
