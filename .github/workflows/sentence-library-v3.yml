name: Sentence Library V3 Android

on:
  push:
    branches: [sentence-library-v3-redesign]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle -p sentence-library-v3 :app:testDebugUnitTest --no-daemon
      - name: Build debug and release
        run: gradle -p sentence-library-v3 :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Verify APK identity
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)
          test -n "$AAPT"
          APP_ID=$($AAPT dump badging sentence-library-v3/app/build/outputs/apk/debug/app-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$APP_ID" = "com.beomsoo.sentencelibrary"
      - uses: actions/upload-artifact@v4
        with:
          name: sentence-library-v3-apks
          path: |
            sentence-library-v3/app/build/outputs/apk/debug/app-debug.apk
            sentence-library-v3/app/build/outputs/apk/release/app-release-unsigned.apk
